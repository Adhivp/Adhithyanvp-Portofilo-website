name = "strapi-webhook"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Workers AI binding for generating embeddings
[ai]
binding = "AI"

# Vectorize binding
[[vectorize]]
binding = "VECTORIZE"
index_name = "adhibot-knowledge"

# D1 Database for content hash tracking
[[d1_databases]]
binding = "DB"
database_name = "adhibot-content-hashes"
database_id = "d034d88d-447b-495b-a9b9-0878ae4594c1"

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via wrangler secret put)
# WEBHOOK_SECRET - to verify requests from Strapi
# DEPLOY_HOOK_URL - Cloudflare Pages Deploy Hook URL (from Pages dashboard)
# STRAPI_API_URL - your Strapi instance
# STRAPI_TOKEN - read access token
